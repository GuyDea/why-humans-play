<header class="masthead">
  <div class="identity">
    <span class="brand">Why Humans Play</span>
    <span class="divider" aria-hidden="true"></span>
    <strong>Script Studio</strong>
  </div>
  <nav aria-label="Script Creator" appHelpTarget="masthead.nav">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Studio
    </a>
    <a routerLink="/discover" routerLinkActive="active">Discover</a>
    <a routerLink="/topics" routerLinkActive="active">Topics</a>
    <a routerLink="/pipeline" routerLinkActive="active">Pipeline</a>
    <a routerLink="/lessons" routerLinkActive="active">Lessons</a>
    <a routerLink="/console" routerLinkActive="active">Console</a>
    <a routerLink="/welcome" routerLinkActive="active">Welcome</a>
    <button
      id="help-trigger"
      class="help-trigger"
      type="button"
      aria-label="Open help"
      aria-controls="script-creator-help"
      [attr.aria-expanded]="helpOpen()"
      (click)="openHelp()"
    >
      Help
    </button>
  </nav>
  <div class="masthead-tools" appHelpTarget="masthead.model">
    <app-masthead-model-selector />
  </div>
</header>

<router-outlet />

@if (helpOpen()) {
  <app-help-drawer (helpClose)="closeHelp()" />
}
